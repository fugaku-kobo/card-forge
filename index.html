    ${opts.showIndex !== false ? `<div class="cp-index">${idx+1}</div>` : ''}
    ${opts.controls || ''}
    ${opts.extraInner || ''}
    ${body}
    ${codeTag}
  </div>`;
}

// 技の描画(技名/コスト/効果)
// スキルテキストを 「技名 必要コストN 効果」形式に組み立てる(保存用)
function composeSkillText(name, cost, effect) {
  name = (name || '').trim();
  cost = (cost || '').trim();
  effect = (effect || '').trim();
  if (!name && !cost && !effect) return '';
  const parts = [];
  if (name) parts.push(name);
  if (cost) parts.push(`必要コスト${normalizeNumStr(cost)}`);
  if (effect) parts.push(effect);
  return parts.join('　');
}

// 既存のスキルテキストを 名前/コスト/効果 に分解(編集用)
function parseSkillText(text) {
  text = (text || '').trim();
  if (!text) return { name: '', cost: '', effect: '' };
  // パターンA: 「技名 必要コスト1 効果」
  let m = text.match(/^(.+?)[\s　]+(?:必要)?コスト[\s　]*([0-9０-９]+)[\s　]+(.+)$/);
  if (m) return { name: m[1].trim(), cost: normalizeNumStr(m[2]), effect: m[3].trim() };
  // パターンB: 「技名 (コスト1) 効果」
  m = text.match(/^(.+?)[\s　]*[（(](?:必要)?コスト[\s　]*([0-9０-９]+)[）)][\s　]*(.+)$/);
  if (m) return { name: m[1].trim(), cost: normalizeNumStr(m[2]), effect: m[3].trim() };
  // パターンC: 末尾コスト「技名 必要コスト1」(効果なし)
  m = text.match(/^(.+?)[\s　]+(?:必要)?コスト[\s　]*([0-9０-９]+)[\s　]*$/);
  if (m) return { name: m[1].trim(), cost: normalizeNumStr(m[2]), effect: '' };
  // 分解できない: 1行目を技名扱い、残りを効果に(コストは空)
  // 多くの場合「技名 効果」のパターン → 最初の空白で区切る試み
  const sp = text.match(/^(\S+)[\s　]+(.+)$/);
  if (sp) return { name: sp[1].trim(), cost: '', effect: sp[2].trim() };
  return { name: text, cost: '', effect: '' };
}

function renderSkill(text, label, color) {
  color = color || '#5d3a6b'; // フォールバック色
  if (!text || !text.trim()) {
    return `<div class="cp-skill cp-skill-empty">${label}: なし</div>`;
  }
  // テキストから「技名 [必要]コストN 効果」を抽出 (全角数字・「必要」省略・括弧表記にも対応)
  let name = '', cost = '', effect = '';
  // パターンA: 「技名 必要コスト1 効果」 / 「技名 コスト1 効果」(全角・半角どちらも)
  let m = text.match(/^(.+?)[\s　]+(?:必要)?コスト[\s　]*([0-9０-９]+)[\s　]+(.+)$/);
  if (m) { name = m[1]; cost = m[2]; effect = m[3]; }
  // パターンB: 「技名 (コスト1) 効果」 / 「技名(コスト1)効果」
  if (!name) {
    m = text.match(/^(.+?)[\s　]*[（(](?:必要)?コスト[\s　]*([0-9０-９]+)[）)][\s　]*(.+)$/);
    if (m) { name = m[1]; cost = m[2]; effect = m[3]; }
  }
  // パターンC: 末尾コスト無し「技名 必要コスト1」(効果なし、または効果が技名と同行)
  if (!name) {
    m = text.match(/^(.+?)[\s　]+(?:必要)?コスト[\s　]*([0-9０-９]+)[\s　]*$/);
    if (m) { name = m[1]; cost = m[2]; effect = ''; }
  }
  // パターンD: フォールバック「技名 効果」(コストなし) — 名前と効果は分離して描画
  if (!name) {
    const sp = text.match(/^(\S+?)[\s　]+(.+)$/);
    if (sp) { name = sp[1]; cost = ''; effect = sp[2]; }
    else { name = text; cost = ''; effect = ''; }
  }
  const costHalfWidth = normalizeNumStr(cost);
  // 背景色は inline style で直接指定 (CSS currentColor / var() に頼らないので html2canvas でも確実)
  const costBadge = costHalfWidth
    ? `<span class="cp-skill-cost" style="background:${color}">コスト${escapeHtml(costHalfWidth)}</span>`
    : `<span class="cp-skill-cost cp-skill-cost-none" style="background:${color}; opacity:0.45;">−</span>`;
  return `<div class="cp-skill">
    <div class="cp-skill-head">
      <span class="cp-skill-name">${escapeHtml(name.trim())}</span>
      ${costBadge}
    </div>
    ${effect ? `<div class="cp-skill-effect">${escapeHtml(effect.trim())}</div>` : ''}
  </div>`;
}

// カードタイプを短い名前にする(展開アイディア→展開、など)
function shortenType(t) {
  if (!t) return '';
  if (t.includes('展開')) return '展';
  if (t.includes('テコ')) return 'テ';
  if (t.includes('どんでん')) return '返';
  if (t.includes('主人公')) return '主';
  return t.substring(0, 1);
}

function render() {
  refreshTypeSelects();
  const grid = document.getElementById('cardGrid');
  const filtered = getFilteredCards();
  const isCustomSort = document.getElementById('filter-sort').value === 'custom' &&
                        !document.getElementById('filter-search').value &&
                        !document.getElementById('filter-type').value &&
                        !document.getElementById('filter-level').value;

  document.getElementById('cardCount').textContent = `${filtered.length} / ${state.cards.length}枚`;

  if (state.cards.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;">
      <h3>EMPTY LIBRARY</h3>
      <p>「📊 Excel取込」からExcelファイルを読み込むか、左のフォームから新規作成してください</p></div>`;
    return;
  }
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;">
      <h3>NO MATCH</h3><p>フィルタ条件に合うカードはありません</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map((c) => {
    const i = c.originalIdx;
    const dragAttrs = isCustomSort ? `draggable="true" ondragstart="onDragStart(event,${i})" ondragover="onDragOver(event)" ondrop="onDrop(event,${i})" ondragend="onDragEnd(event)"` : '';
    const reorderBtns = isCustomSort ? `
      <div class="cp-controls">
        <button class="cp-ctrl-btn" onclick="event.stopPropagation(); moveCard(${i}, -1)" title="上へ">▲</button>
        <button class="cp-ctrl-btn" onclick="event.stopPropagation(); moveCard(${i}, 1)" title="下へ">▼</button>
      </div>` : '';
    return buildCardHTML(c, i, {
      selected: editingIdx === i,
      attrs: `onclick="editCard(${i})" ${dragAttrs}`,
      controls: reorderBtns
    });
  }).join('');
}

function escapeHtml(s) {
  if (s === undefined || s === null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============ DRAG & DROP ============
function onDragStart(e, idx) { dragSrcIdx = idx; e.target.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
function onDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function onDrop(e, dstIdx) {
  e.preventDefault();
  if (dragSrcIdx === null || dragSrcIdx === dstIdx) return;
  // 編集中カードのidを覚えておき、並び替え後に新indexへ追従させる
  const editingId = editingIdx !== null ? state.cards[editingIdx]?.id : null;
  const [moved] = state.cards.splice(dragSrcIdx, 1);
  state.cards.splice(dstIdx, 0, moved);
  if (editingId) editingIdx = state.cards.findIndex(c => c.id === editingId);
  saveData(); render();
}
function onDragEnd(e) { e.target.classList.remove('dragging'); dragSrcIdx = null; }
function moveCard(idx, delta) {
  const newIdx = idx + delta;
  if (newIdx < 0 || newIdx >= state.cards.length) return;
  const editingId = editingIdx !== null ? state.cards[editingIdx]?.id : null;
  const [moved] = state.cards.splice(idx, 1);
  state.cards.splice(newIdx, 0, moved);
  if (editingId) editingIdx = state.cards.findIndex(c => c.id === editingId);
  saveData(); render();
}

// ============ CARD ZOOM ============
function openCardZoom(idx) {
  const c = state.cards[idx];
  if (!c) return;
  document.getElementById('cardZoomCard').innerHTML = buildCardHTML(c, idx, {showIndex: false, attrs: ''});
  document.getElementById('cardZoomMeta').textContent = `№ ${idx + 1} / ${state.cards.length}`;
  document.getElementById('cardZoomBg').classList.add('show');
}
function closeCardZoom(event) {
  if (event && event.target.id !== 'cardZoomBg' && !event.target.classList.contains('card-zoom-close')) return;
  document.getElementById('cardZoomBg').classList.remove('show');
}

// ============ DECK MANAGEMENT ============
function renderDeckList() {
  const list = document.getElementById('deckListItems');
  if (state.decks.length === 0) {
    list.innerHTML = `<div class="empty-state" style="padding: 20px;"><p>まだデッキがありません</p></div>`;
    renderDeckDetail();
    return;
  }
  list.innerHTML = state.decks.map(d => {
    const cardCount = getDeckTotalCount(d);
    const uniqueCount = (d.cards || []).length;
    return `<div class="deck-item ${state.currentDeckId === d.id ? 'active' : ''}" onclick="selectDeck('${d.id}')">
      <div class="deck-item-name">${escapeHtml(d.name)}</div>
      <div class="deck-item-meta">${cardCount}枚 (${uniqueCount}種類)</div></div>`;
  }).join('');
  renderDeckDetail();
}
function selectDeck(id) { state.currentDeckId = id; saveData(); renderDeckList(); }
function createDeck() {
  promptInput('新規デッキ', 'デッキ名を入力してください', '', (name) => {
    if (!name) return;
    const newDeck = { id: 'd' + Date.now(), name, description: '', cards: [] };
    state.decks.push(newDeck);
    state.currentDeckId = newDeck.id;
    saveData(); renderDeckList();
    toast(`「${name}」を作成`);
  });
}
function renameDeck() {
  const deck = state.decks.find(d => d.id === state.currentDeckId);
  if (!deck) return;
  promptInput('デッキ名を変更', '新しい名前', deck.name, (name) => {
    if (!name) return;
    deck.name = name; saveData(); renderDeckList();
  });
}
function editDeckDescription() {
  const deck = state.decks.find(d => d.id === state.currentDeckId);
  if (!deck) return;
  promptInput('デッキの説明', '説明文', deck.description || '', (desc) => {
    deck.description = desc; saveData(); renderDeckList();
  });
}
function deleteDeck() {
  const deck = state.decks.find(d => d.id === state.currentDeckId);
  if (!deck) return;
  showModal('デッキを削除', `「${deck.name}」を削除します。カードは残ります。`, () => {
    state.decks = state.decks.filter(d => d.id !== state.currentDeckId);
    state.currentDeckId = null;
    saveData(); renderDeckList();
    toast('デッキを削除');
  });
}

// ============ デッキ共有コード ============
function utf8ToB64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function b64ToUtf8(b64) {
  return decodeURIComponent(escape(atob(b64)));
}

function exportDeckCode(deckId) {
  const deck = state.decks.find(d => d.id === (deckId || state.currentDeckId));
  if (!deck) return;
  const cardIds = new Set((deck.cards || []).map(e => e.cardId));
  const cards = state.cards.filter(c => cardIds.has(c.id));
  const payload = {
    v: 1,
    deck: { name: deck.name, description: deck.description || '', cards: deck.cards || [] },
    cards
  };
  const code = utf8ToB64(JSON.stringify(payload));
  // モーダル表示
  document.getElementById('deckCodeTitle').textContent = `📋 「${deck.name}」の共有コード`;
  document.getElementById('deckCodeDesc').textContent = `このコードを相手に渡してください。相手は「📥 コードから取込」で読み込むとデッキとカードが追加されます。`;
  const ta = document.getElementById('deckCodeText');
  ta.value = code;
  ta.readOnly = true;
  document.getElementById('deckCodeActions').innerHTML = `
    <button onclick="closeDeckCodeModal()">閉じる</button>
    <button class="btn-primary" onclick="copyDeckCode()">📋 コピー</button>`;
  document.getElementById('deckCodeModal').classList.add('show');
  setTimeout(() => { ta.select(); }, 50);
}

function copyDeckCode() {
  const ta = document.getElementById('deckCodeText');
  ta.select();
  navigator.clipboard?.writeText(ta.value).then(() => toast('コピーしました'))
    .catch(() => { document.execCommand('copy'); toast('コピーしました'); });
}

function openImportDeckCode() {
  document.getElementById('deckCodeTitle').textContent = '📥 デッキコードから取込';
  document.getElementById('deckCodeDesc').textContent = '相手から受け取ったコードを貼り付けてください。デッキと使用カードが追加されます。';
  const ta = document.getElementById('deckCodeText');
  ta.value = '';
  ta.readOnly = false;
  document.getElementById('deckCodeActions').innerHTML = `
    <button onclick="closeDeckCodeModal()">キャンセル</button>
    <button class="btn-primary" onclick="importDeckCode()">読込</button>`;
  document.getElementById('deckCodeModal').classList.add('show');
  setTimeout(() => { ta.focus(); }, 50);
}

function closeDeckCodeModal() {
  document.getElementById('deckCodeModal').classList.remove('show');
}

function importDeckCode() {
  const code = document.getElementById('deckCodeText').value.trim();
  if (!code) { toast('コードを貼り付けてください'); return; }
  let payload;
  try {
    payload = JSON.parse(b64ToUtf8(code));
  } catch (e) {
    toast('コードが不正です');
    console.error(e);
    return;
  }
  if (!payload || payload.v !== 1 || !payload.deck || !Array.isArray(payload.cards)) {
    toast('対応していない形式です');
    return;
  }
  // 衝突を避けるため、取り込むカードには常に新IDを発行
  // (同じID `c5` が両者で別カードを指す危険を回避)
  const idMap = {};
  let addedCards = 0;
  payload.cards.forEach(c => {
    if (!c.id) return;
    const newId = cid();
    idMap[c.id] = newId;
    state.cards.push({...c, id: newId});
    addedCards++;
  });
  // デッキの cardId 参照も新IDに置き換える
  const newDeckCards = (payload.deck.cards || [])
    .map(e => ({cardId: idMap[e.cardId], count: e.count}))
    .filter(e => e.cardId);
  const newDeck = {
    id: 'd' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    name: payload.deck.name + ' (取込)',
    description: payload.deck.description || '',
    cards: newDeckCards
  };
  state.decks.push(newDeck);
  state.currentDeckId = newDeck.id;
  saveData();
  refreshTypeSelects(); render(); renderDeckList();
  closeDeckCodeModal();
  toast(`「${newDeck.name}」を取込(カード${addedCards}枚追加)`);
}
// リーダー状況パネル
function renderLeaderStatusBox(leaderInfo, leaderSetCandidates) {
  const names = Object.keys(leaderInfo);
  const allLevelsLabel = ['1','2','3'];
  let statusHtml = '';
  if (names.length === 0) {
    statusHtml = `<div class="leader-status warn">⚠ 主人公カードが選ばれていません。Lv1/2/3 の3枚セットが必要です。</div>`;
  } else {
    statusHtml = names.map(nm => {
      const has = leaderInfo[nm].lvs;
      const missing = allLevelsLabel.filter(lv => !has.has(lv));
      const cls = missing.length === 0 ? 'ok' : 'warn';
      const detail = allLevelsLabel.map(lv => `<span class="leader-lv ${has.has(lv)?'have':'miss'}">Lv${lv}</span>`).join('');
      const note = missing.length === 0 ? '揃っています' : `Lv${missing.join('/')} が不足`;
      return `<div class="leader-status ${cls}">
        <strong>${escapeHtml(nm)}</strong> ${detail} <span class="leader-note">(${note})</span>
      </div>`;
    }).join('');
  }
  // ワンクリックでセット追加するボタン
  const candidateOptions = leaderSetCandidates.length === 0 ? ''
    : leaderSetCandidates.map(nm => `<button class="btn-small" onclick="setLeaderSet('${escapeHtml(nm).replace(/'/g, "\\'")}')">+ ${escapeHtml(nm)} (Lv1/2/3)</button>`).join('');

  return `
    <div class="deck-section-title">主人公カード — 各1枚、Lv1/2/3の3枚セットが必須</div>
    ${statusHtml}
    ${candidateOptions ? `<div class="leader-actions"><span class="leader-actions-label">セット追加:</span>${candidateOptions}</div>` : ''}
  `;
}

// 指定名のリーダー Lv1/2/3 を一括でデッキに追加(既に1枚あるレベルはスキップ)
function setLeaderSet(name) {
  const deck = state.decks.find(d => d.id === state.currentDeckId);
  if (!deck) return;
  if (!deck.cards) deck.cards = [];
  const heroes = state.cards.filter(c => isLeaderCard(c) && c.name === name);
  let added = 0;
  ['1','2','3'].forEach(lv => {
    const card = heroes.find(c => String(c.level) === lv);
    if (!card) return;
    const existing = deck.cards.find(x => x.cardId === card.id);
    if (existing && existing.count >= 1) return; // 既に1枚あるのでスキップ
    if (existing) { existing.count = 1; }
    else { deck.cards.push({cardId: card.id, count: 1}); }
    added++;
  });
  saveData(); renderDeckList();
  toast(added > 0 ? `「${name}」をセット追加 (${added}枚)` : `「${name}」は既に揃っています`);
}

// 主人公(リーダー)カードかどうか
function isLeaderCard(card) {
  return card && getTypeKind(card.type) === 'leveled';
}
// カード1種あたりの最大枚数(主人公は1枚、unlimited は無制限)
function getMaxCopies(card) {
  if (!card) return 4;
  if (card.unlimited) return Infinity;
  if (isLeaderCard(card)) return 1;
  return 4;
}

function addCardToDeck(cardId) {
  const deck = state.decks.find(d => d.id === state.currentDeckId);
  if (!deck) return;
  if (!deck.cards) deck.cards = [];

  const card = state.cards.find(c => c.id === cardId);
  if (!card) return;

  const existing = deck.cards.find(x => x.cardId === cardId);
  const maxCount = getMaxCopies(card);

  if (existing) {
    if (existing.count >= maxCount) {
      const msg = card.unlimited ? '上限なし(エラー)'
                : isLeaderCard(card) ? '主人公カードは1枚までです'
                : 'デッキに同じカードは4枚までです';
      toast(msg);
      return;
    }
    existing.count++;
  } else {
    deck.cards.push({cardId, count: 1});
  }
  saveData(); renderDeckList();
  toast(`「${card.name}」を追加 (${(existing ? existing.count : 1)}枚目)`);
}

function decrementCardInDeck(cardId) {
  const deck = state.decks.find(d => d.id === state.currentDeckId);
  if (!deck) return;
  const entry = (deck.cards || []).find(x => x.cardId === cardId);
  if (!entry) return;
  entry.count--;
  if (entry.count <= 0) {
    deck.cards = deck.cards.filter(x => x.cardId !== cardId);
  }
  saveData(); renderDeckList();
}

function removeCardFromDeck(cardId) {
  const deck = state.decks.find(d => d.id === state.currentDeckId);
  if (!deck) return;
  deck.cards = (deck.cards || []).filter(x => x.cardId !== cardId);
  saveData(); renderDeckList();
}

// デッキの合計枚数(枚数バッジ含む)
function getDeckTotalCount(deck) {
  return (deck.cards || []).reduce((sum, x) => sum + (x.count || 0), 0);
}
function renderDeckDetail() {
  const detail = document.getElementById('deckDetail');
  const deck = state.decks.find(d => d.id === state.currentDeckId);
  if (!deck) {
    detail.innerHTML = `<div class="empty-state"><h3>NO DECK SELECTED</h3>
      <p>左から選ぶか、新規デッキを作成してください</p></div>`;
    return;
  }

  // デッキ内カードを {card, count} のペアで取得
  const inDeckEntries = (deck.cards || []).map(entry => ({
    card: state.cards.find(c => c.id === entry.cardId),
    count: entry.count
  })).filter(e => e.card);

  // 追加可能カード: デッキ内にあっても、枚数が上限未満なら追加可
  const availableAll = state.cards.filter(c => {
    const entry = (deck.cards || []).find(x => x.cardId === c.id);
    const currentCount = entry ? entry.count : 0;
    return currentCount < getMaxCopies(c);
  });

  // リーダー状況の集計: 主人公カードを名前ごとにまとめ、Lv1/2/3 が揃っているか確認
  const leaderInfo = {}; // name -> { lvs: Set<'1'|'2'|'3'>, cards: [card] }
  inDeckEntries.forEach(e => {
    if (!isLeaderCard(e.card)) return;
    const nm = e.card.name || '無名';
    if (!leaderInfo[nm]) leaderInfo[nm] = { lvs: new Set(), cards: [] };
    if (e.card.level) leaderInfo[nm].lvs.add(String(e.card.level));
    leaderInfo[nm].cards.push(e.card);
  });
  const leaderNames = Object.keys(leaderInfo);
  // 全主人公カードを名前+レベルで列挙(リーダーセット候補一覧)
  const allHeroes = state.cards.filter(isLeaderCard);
  const heroByName = {};
  allHeroes.forEach(c => {
    const nm = c.name || '無名';
    if (!heroByName[nm]) heroByName[nm] = {};
    if (c.level) heroByName[nm][String(c.level)] = c;
  });
  const leaderSetCandidates = Object.keys(heroByName)
    .filter(nm => heroByName[nm]['1'] && heroByName[nm]['2'] && heroByName[nm]['3'])
    .sort();

  // 作品名一覧 (重複排除、空文字除外、ソート)
  const allWorks = [...new Set(state.cards.map(c => (c.work || '').trim()).filter(w => w))].sort();

  // フィルタ適用
  const f = deckAddFilter;
  const searchLower = (f.search || '').toLowerCase();
  const availableCards = availableAll.filter(c => {
    if (f.work && (c.work || '').trim() !== f.work) return false;
    if (f.type && c.type !== f.type) return false;
    if (searchLower) {
      const hay = [c.name, c.skill1, c.skill2, c.effect1, c.effect2, c.effect3, c.subrole, c.work, c.rule, c.other]
        .filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(searchLower)) return false;
    }
    return true;
  });

  const totalCount = getDeckTotalCount(deck);
  const uniqueCount = inDeckEntries.length;

  detail.innerHTML = `
    <div class="deck-header">
      <div class="deck-header-info">
        <h2>${escapeHtml(deck.name)}</h2>
        ${deck.description ? `<p>${escapeHtml(deck.description)}</p>` : '<p style="opacity:0.5">(説明なし)</p>'}
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn-small" onclick="renameDeck()">名前変更</button>
        <button class="btn-small" onclick="editDeckDescription()">説明編集</button>
        <button class="btn-small" onclick="exportDeckCode()">📋 共有コード</button>
        <button class="btn-small btn-primary" onclick="generatePDF('deck')">⚔ デッキPDF</button>
        <button class="btn-small btn-danger" onclick="deleteDeck()">削除</button>
      </div>
    </div>
    <div class="deck-section">
      ${renderLeaderStatusBox(leaderInfo, leaderSetCandidates)}
    </div>
    <div class="deck-section">
      <div class="deck-section-title">デッキ内のカード — 計${totalCount}枚 (${uniqueCount}種類)</div>
      ${inDeckEntries.length === 0 ? `<div class="empty-state" style="padding: 30px;"><p>まだカードがありません。下から追加してください。</p></div>`
        : `<div class="deck-cards">${inDeckEntries.map(e => {
            const c = e.card;
            const origIdx = state.cards.indexOf(c);
            const maxCount = getMaxCopies(c);
            const canAdd = e.count < maxCount;
            const countBadge = `<div class="deck-count-badge">×${e.count}</div>`;
            const counterCtrls = `
              <div class="deck-card-controls" onclick="event.stopPropagation()">
                <button class="cp-ctrl-btn" onclick="event.stopPropagation(); decrementCardInDeck('${c.id}')" title="1枚減らす">−</button>
                <button class="cp-ctrl-btn" onclick="event.stopPropagation(); addCardToDeck('${c.id}')" title="1枚増やす" ${!canAdd ? 'disabled' : ''}>＋</button>
              </div>`;
            return buildCardHTML(c, origIdx, {
              inDeck: true, showIndex: false,
              attrs: `onclick="openCardZoom(${origIdx})"`,
              extraInner: countBadge + counterCtrls
            });
          }).join('')}</div>`}
    </div>
    <div class="deck-section">
      <div class="deck-section-title">追加できるカード (${availableCards.length} / ${availableAll.length}種類)</div>
      <div class="deck-add-filter">
        <input type="text" id="deck-filter-search" value="${escapeHtml(f.search)}"
               placeholder="🔍 名前・スキル・効果で検索"
               oninput="updateDeckAddFilter('search', this.value)">
        <select id="deck-filter-work" onchange="updateDeckAddFilter('work', this.value)">
          <option value="">すべての作品</option>
          ${allWorks.map(w => `<option value="${escapeHtml(w)}" ${w===f.work?'selected':''}>${escapeHtml(w)}</option>`).join('')}
        </select>
        <select id="deck-filter-type" onchange="updateDeckAddFilter('type', this.value)">
          <option value="">すべてのタイプ</option>
          ${state.types.map(t => `<option value="${escapeHtml(t.name)}" ${t.name===f.type?'selected':''}>${escapeHtml(t.name)}</option>`).join('')}
        </select>
        <button class="btn-small" onclick="resetDeckAddFilter()">クリア</button>
      </div>
      ${availableCards.length === 0 ? `<div class="empty-state" style="padding: 30px;"><p>条件に合うカードがありません</p></div>`
        : `<div class="add-card-list">${availableCards.map(c => {
            const entry = (deck.cards || []).find(x => x.cardId === c.id);
            const currentCount = entry ? entry.count : 0;
            const max = getMaxCopies(c);
            const limitText = c.unlimited ? '∞' : `${currentCount}/${max}`;
            return `
            <div class="add-card-row" onclick="addCardToDeck('${c.id}')">
              <div style="width: 8px; height: 24px; background: ${getTypeColor(c.type)};"></div>
              <div class="add-card-name">${escapeHtml(c.name)}${c.unlimited ? ' <span style="color:#c9a961;">∞</span>' : ''}</div>
              <div class="add-card-meta">${escapeHtml(c.type)}${c.level?' / Lv.'+escapeHtml(c.level):''}${c.work?' / '+escapeHtml(c.work):''} <span style="color: #c9a961;">[${limitText}]</span></div>
              <button class="add-card-btn btn-primary">+ 追加</button>
            </div>`;
          }).join('')}</div>`}
    </div>`;

  // 検索入力のフォーカスを保持 (oninputでrenderDeckDetail()するためフォーカス復元が必要)
  if (deckAddFilter._focused === 'search') {
    const el = document.getElementById('deck-filter-search');
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
}

function updateDeckAddFilter(key, value) {
  deckAddFilter[key] = value;
  if (key === 'search') deckAddFilter._focused = 'search';
  else deckAddFilter._focused = null;
  renderDeckDetail();
  deckAddFilter._focused = null;
}

function resetDeckAddFilter() {
  deckAddFilter = { search: '', work: '', type: '' };
  renderDeckDetail();
}

// ============ STATS ============
function renderStats() {
  const summary = document.getElementById('statSummary');
  const layout = document.getElementById('statsLayout');
  const total = state.cards.length;
  if (total === 0) {
    summary.innerHTML = '';
    layout.innerHTML = `<div class="empty-state"><h3>NO DATA</h3><p>カードがまだありません</p></div>`;
    return;
  }
  const typeCounts = {};
  state.types.forEach(t => typeCounts[t.name] = 0);
  state.cards.forEach(c => { typeCounts[c.type] = (typeCounts[c.type] || 0) + 1; });

  const levelCounts = {};
  state.cards.forEach(c => {
    const lv = c.level || '-';
    levelCounts[lv] = (levelCounts[lv] || 0) + 1;
  });
  const numericLevels = state.cards.map(c => parseFloat(c.level)).filter(v => !isNaN(v));
  const avgLevel = numericLevels.length ? (numericLevels.reduce((a,b)=>a+b,0)/numericLevels.length).toFixed(1) : '-';

  // HP統計 (キャラクターのみ)
  const hps = state.cards.filter(c => getTypeKind(c.type) === 'character').map(c => parseFloat(c.hp)).filter(v => !isNaN(v));
  const avgHP = hps.length ? Math.round(hps.reduce((a,b)=>a+b,0)/hps.length) : '-';

  // 自信作の数
  const shinsakuCount = state.cards.filter(c => c.shinsaku).length;

  summary.innerHTML = `
    <div class="stat-big"><div class="stat-big-value">${total}</div><div class="stat-big-label">Total Cards</div></div>
    <div class="stat-big"><div class="stat-big-value">${state.decks.length}</div><div class="stat-big-label">Decks</div></div>
    <div class="stat-big"><div class="stat-big-value">${avgLevel}</div><div class="stat-big-label">Avg. Level</div></div>
    <div class="stat-big"><div class="stat-big-value">${avgHP}</div><div class="stat-big-label">Avg. HP</div></div>
    <div class="stat-big"><div class="stat-big-value">${shinsakuCount}</div><div class="stat-big-label">★ 自信作</div></div>
  `;

  const maxType = Math.max(...Object.values(typeCounts), 1);
  const typeRows = state.types.map(t => {
    const count = typeCounts[t.name] || 0;
    const pct = (count / maxType) * 100;
    return `<div class="stat-row">
      <div class="stat-label">${escapeHtml(t.name)}</div>
      <div class="stat-bar"><div class="stat-bar-fill" style="width: ${pct}%; background: ${t.color};"></div></div>
      <div class="stat-value">${count}</div></div>`;
  }).join('');

  const sortedLevels = Object.keys(levelCounts).sort((a,b) => {
    const na=parseFloat(a), nb=parseFloat(b);
    if (!isNaN(na)&&!isNaN(nb)) return na-nb;
    return a.localeCompare(b);
  });
  const maxLevel = Math.max(...Object.values(levelCounts), 1);
  const levelRows = sortedLevels.map(lv => {
    const count = levelCounts[lv];
    const pct = (count / maxLevel) * 100;
    return `<div class="stat-row">
      <div class="stat-label">Lv.${escapeHtml(lv)}</div>
      <div class="stat-bar"><div class="stat-bar-fill" style="width: ${pct}%;"></div></div>
      <div class="stat-value">${count}</div></div>`;
  }).join('');

  layout.innerHTML = `
    <div class="stat-card"><div class="stat-card-title">タイプ分布</div>${typeRows}</div>
    <div class="stat-card"><div class="stat-card-title">レベル分布</div>${levelRows}</div>`;
}

// ============ SETTINGS ============
function renderSettings() {
  const list = document.getElementById('typeList');
  list.innerHTML = state.types.map((t, i) => `
    <div class="type-row">
      <input type="text" value="${escapeHtml(t.name)}" onchange="updateTypeName(${i}, this.value)" ${t.builtin ? 'disabled' : ''}>
      <input type="color" value="${t.color}" onchange="updateTypeColor(${i}, this.value)">
      <div class="color-preview" style="background:${t.color}"></div>
      <span class="type-builtin">${t.builtin ? '基本' : 'カスタム'}</span>
      <button class="btn-danger btn-icon" onclick="removeType(${i})" ${t.builtin ? 'disabled' : ''}>削除</button>
    </div>`).join('');
}
function addType() {
  promptInput('新しいタイプ', 'タイプ名を入力(キャラクター仕様で作成されます)', '', (name) => {
    if (!name) return;
    if (state.types.find(t => t.name === name)) { toast('同じ名前のタイプがあります'); return; }
    const palette = ['#a06b1f','#4a6b6b','#7c2c5f','#3d6b3a','#6b3d4a','#2c6b6b'];
    const color = palette[Math.floor(Math.random()*palette.length)];
    state.types.push({name, color, kind: 'character', builtin: false});
    saveData(); renderSettings(); refreshTypeSelects();
    toast(`タイプ「${name}」を追加`);
  });
}
function updateTypeName(idx, newName) {
  const t = state.types[idx];
  if (t.builtin) return;
  newName = newName.trim();
  if (!newName) { renderSettings(); return; }
  if (t.name === newName) return;
  if (state.types.find((x,i)=>i!==idx && x.name===newName)) { toast('同じ名前のタイプがあります'); renderSettings(); return; }
  const oldName = t.name;
  t.name = newName;
  state.cards.forEach(c => { if (c.type === oldName) c.type = newName; });
  saveData(); renderSettings(); refreshTypeSelects(); render();
}
function updateTypeColor(idx, color) {
  state.types[idx].color = color;
  saveData(); renderSettings(); render();
}
function removeType(idx) {
  const t = state.types[idx];
  if (t.builtin) return;
  const cardCount = state.cards.filter(c => c.type === t.name).length;
  showModal('タイプを削除', `「${t.name}」を削除します。${cardCount > 0 ? `このタイプの${cardCount}枚のカードは「キャラクター」に変更されます。` : ''}`, () => {
    state.cards.forEach(c => { if (c.type === t.name) c.type = 'キャラクター'; });
    state.types.splice(idx, 1);
    saveData(); renderSettings(); refreshTypeSelects(); render();
    toast('タイプを削除');
  });
}
function resetAllData() {
  showModal('全データを削除', '本当に全てのデータ(カード・デッキ・タイプ設定)を削除しますか? この操作は取り消せません。', () => {
    localStorage.removeItem(STORAGE_KEY);
    state.cards = []; state.types = []; state.decks = []; state.currentDeckId = null;
    cardIdCounter = 1;
    ensureBuiltinTypes();
    saveData();
    refreshTypeSelects(); render(); renderDeckList(); renderSettings();
    toast('全データを削除しました');
  });
}

// ============ MODALS ============
let modalCallback = null;
function showModal(title, text, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  modalCallback = onConfirm;
  document.getElementById('confirmModal').classList.add('show');
}
function closeModal() { document.getElementById('confirmModal').classList.remove('show'); modalCallback = null; }
document.getElementById('modalConfirm').onclick = () => { if (modalCallback) modalCallback(); closeModal(); };
document.getElementById('confirmModal').onclick = (e) => { if (e.target.id === 'confirmModal') closeModal(); };

let promptCallback = null;
function promptInput(title, text, defaultValue, onConfirm) {
  document.getElementById('promptTitle').textContent = title;
  document.getElementById('promptText').textContent = text;
  document.getElementById('promptInput').value = defaultValue || '';
  promptCallback = onConfirm;
  document.getElementById('promptModal').classList.add('show');
  setTimeout(() => document.getElementById('promptInput').focus(), 50);
}
function closePromptModal() { document.getElementById('promptModal').classList.remove('show'); promptCallback = null; }
document.getElementById('promptConfirm').onclick = () => {
  const val = document.getElementById('promptInput').value.trim();
  if (promptCallback) promptCallback(val); closePromptModal();
};
document.getElementById('promptInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('promptConfirm').click();
});
document.getElementById('promptModal').onclick = (e) => { if (e.target.id === 'promptModal') closePromptModal(); };

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// ============ EXCEL IMPORT ============
function importXLSX(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type: 'array'});

      const importedCards = [];

      wb.SheetNames.forEach(sheetName => {
        const ws = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(ws, {header: 1, defval: ''});
        if (rows.length < 2) return;

        const headers = rows[0].map(h => String(h || '').trim());
        // 「使い方」「世界観やルール」などの説明シートはスキップ
        if (!headers.some(h => h.includes('カード名') || h.includes('No.') || h === 'ID')) return;

        // ヘッダーマッピング (新旧両形式対応)
        const colIdx = {};
        headers.forEach((h, i) => {
          // ID/管理番号
          if (h === 'ID' || h === '型番') colIdx.cardCode = i;
          else if (h === 'No.' || h === 'No') colIdx.no = i;
          // 名前・タイプ・作品
          else if (h === 'カード名') colIdx.name = i;
          else if (h === 'カードタイプ') colIdx.type = i;  // 効果カードシートで使われる
          else if (h === 'タイプ' && !h.includes('カード')) colIdx.type = i;
          else if (h === '作品名') colIdx.work = i;
          // レベル・サブ
          else if (h === 'レベル') colIdx.level = i;
          else if (h === 'サブ区分') colIdx.subrole = i;
          // ステータス
          else if (h === 'HP' || h.includes('HP')) colIdx.hp = i;
          else if (h.includes('IP') && (h.includes('得') || h === 'IP')) colIdx.ip = i;
          else if (h === '自信作') colIdx.shinsaku = i;
          else if (h === 'コスト') colIdx.cost = i;  // 効果カードのコスト
          // 技/スキル分割形式
          else if (h.match(/^(技|スキル)[1１].*名$/)) colIdx.skill1Name = i;
          else if (h.match(/^(技|スキル)[1１].*コスト$/)) colIdx.skill1Cost = i;
          else if (h.match(/^(技|スキル)[1１].*効果$/)) colIdx.skill1Effect = i;
          else if (h.match(/^(技|スキル)[2２].*名$/)) colIdx.skill2Name = i;
          else if (h.match(/^(技|スキル)[2２].*コスト$/)) colIdx.skill2Cost = i;
          else if (h.match(/^(技|スキル)[2２].*効果$/)) colIdx.skill2Effect = i;
          // 旧形式: 技がまとめて1セル
          else if (h === '技１' || h === '技1') colIdx.skill1Full = i;
          else if (h === '技２' || h === '技2') colIdx.skill2Full = i;
          else if (h.match(/^スキル[1１]$/)) colIdx.skill1Full = i;
          else if (h.match(/^スキル[2２]$/)) colIdx.skill2Full = i;
          // 効果カード
          else if (h === 'カード効果' || h === '効果') colIdx.effectMain = i;
          else if (h.includes('効果') && h.match(/[1①]/)) colIdx.effect1 = i;
          else if (h.includes('効果') && h.match(/[2②]/)) colIdx.effect2 = i;
          else if (h.includes('効果') && h.match(/[3③]/)) colIdx.effect3 = i;
          // その他
          else if (h === 'ルール' || h.includes('その他')) colIdx.rule = i;
          else if (h.includes('アイコン') || h.includes('絵文字')) colIdx.icon = i;
          else if (h.includes('イラスト') || h.includes('メモ')) colIdx.art = i;
        });

        // シート名からカードタイプ推測
        let detectedType = null;
        if (sheetName.includes('主人公')) detectedType = '主人公';
        else if (sheetName.includes('キャラクター')) detectedType = 'キャラクター';
        else if (sheetName.includes('展開') && !sheetName.includes('テコ') && !sheetName.includes('どんでん')) detectedType = '展開アイディア';
        else if (sheetName.includes('テコ入れ') || sheetName === 'テコ入れカード') detectedType = 'テコ入れ';
        else if (sheetName.includes('どんでん')) detectedType = 'どんでん返し';

        for (let r = 1; r < rows.length; r++) {
          const row = rows[r];
          const name = String(row[colIdx.name] || '').trim();
          if (!name) continue;

          // タイプ確定
          let cardType = detectedType;
          const typeCellVal = String(row[colIdx.type] || '').trim();
          if (typeCellVal) {
            // タイプ列に明記があれば優先
            if (typeCellVal === 'キャラアイディア' || typeCellVal === 'キャラクター') cardType = 'キャラクター';
            else if (typeCellVal === '主人公') cardType = '主人公';
            else if (typeCellVal === '展開アイディア') cardType = '展開アイディア';
            else if (typeCellVal === 'テコ入れ') cardType = 'テコ入れ';
            else if (typeCellVal === 'どんでん返し') cardType = 'どんでん返し';
          }
          if (!cardType) cardType = 'キャラクター';

          // レベル解析: 数値ならそのまま、"１(脇役)"のような旧形式ならパース
          let level = '', subrole = '', shinsaku = false;
          if (colIdx.level !== undefined) {
            const lvRaw = String(row[colIdx.level] || '').trim();
            if (lvRaw) {
              if (/^[123]$/.test(lvRaw)) {
                level = lvRaw;  // 新形式: 数字のみ
              } else {
                if (/[1１一]/.test(lvRaw)) level = '1';
                else if (/[2２二]/.test(lvRaw)) level = '2';
                else if (/[3３三]/.test(lvRaw)) level = '3';
                const m = lvRaw.match(/[(（]([^)）]+)[)）]/);
                if (m) {
                  const inner = m[1];
                  if (inner.includes('自信作')) shinsaku = true;
                  subrole = inner.replace('・自信作','').replace('自信作','').trim();
                }
              }
            }
          }
          // サブ区分が独立列にあれば優先
          if (colIdx.subrole !== undefined) {
            const sRaw = String(row[colIdx.subrole] || '').trim();
            if (sRaw) subrole = sRaw;
          }
          // 自信作列が独立にあれば
          if (colIdx.shinsaku !== undefined) {
            const sRaw = String(row[colIdx.shinsaku] || '').trim();
            if (sRaw === 'はい' || sRaw === 'TRUE' || sRaw === 'true' || sRaw === '○') shinsaku = true;
          }

          // 技を解析(新形式: 分割列 / 旧形式: 1つのテキスト)
          function buildSkillText(nameCol, costCol, effectCol, fullCol) {
            // 新形式: 分割されている場合
            if (nameCol !== undefined || costCol !== undefined || effectCol !== undefined) {
              const sn = String(row[nameCol] || '').trim();
              const sc = String(row[costCol] || '').trim();
              const se = String(row[effectCol] || '').trim();
              if (!sn && !sc && !se) return '';
              const parts = [];
              if (sn) parts.push(sn);
              if (sc) parts.push(`必要コスト${sc}`);
              if (se) parts.push(se);
              return parts.join('　');
            }
            // 旧形式: 1セル
            if (fullCol !== undefined) return String(row[fullCol] || '').trim();
            return '';
          }
          const skill1 = buildSkillText(colIdx.skill1Name, colIdx.skill1Cost, colIdx.skill1Effect, colIdx.skill1Full);
          const skill2 = buildSkillText(colIdx.skill2Name, colIdx.skill2Cost, colIdx.skill2Effect, colIdx.skill2Full);

          const card = {
            id: cid(),
            type: cardType,
            name: name,
            cardCode: String(row[colIdx.cardCode] || '').trim(),
            work: String(row[colIdx.work] || '').trim(),
            icon: String(row[colIdx.icon] || '').trim(),
            art: String(row[colIdx.art] || '').trim()
          };

          const kind = getTypeKind(cardType);
          if (kind === 'leveled' || kind === 'character') {
            if (level) card.level = level;
            card.skill1 = skill1;
            card.skill2 = skill2;
          }
          if (kind === 'character') {
            card.subrole = subrole;
            card.hp = normalizeNumStr(row[colIdx.hp]);
            card.ip = normalizeNumStr(row[colIdx.ip]);
            card.shinsaku = shinsaku;
            card.rule = String(row[colIdx.rule] || '').trim();
            // 旧形式互換 (otherフィールドに同じ値も入れておく)
            card.other = card.rule;
            // unlimited自動推測
            if (/何枚でも|枚数制限なし|無制限/.test(card.rule)) card.unlimited = true;
          }
          if (kind === 'effect') {
            card.ip = normalizeNumStr(row[colIdx.ip]);
            card.cost = normalizeNumStr(row[colIdx.cost]);
            card.rule = String(row[colIdx.rule] || '').trim();
            // 効果文の組み立て
            if (colIdx.effectMain !== undefined) {
              // 新形式: 効果列1つ
              card.effect1 = String(row[colIdx.effectMain] || '').trim();
              card.effect2 = '';
              card.effect3 = card.rule;  // ルール列が条件文として使われていた旧データ互換
            } else {
              // 旧形式: 効果1〜3
              card.effect1 = String(row[colIdx.effect1] || '').trim();
              card.effect2 = String(row[colIdx.effect2] || '').trim();
              card.effect3 = String(row[colIdx.effect3] || '').trim();
            }
            if (/何枚でも|枚数制限なし|無制限/.test(card.rule)) card.unlimited = true;
          }
          importedCards.push(card);
        }
      });

      if (importedCards.length === 0) {
        toast('読み込めるカードが見つかりませんでした');
        return;
      }

      showModal('Excelインポート', `${importedCards.length}枚のカードを読み込みます。現在のカードは置き換えられます(デッキ・タイプ設定は保持)。`, () => {
        state.cards = importedCards;
        // デッキの参照をクリア (旧IDになっているため)
        state.decks.forEach(d => d.cards = []);
        saveData();
        render(); renderDeckList();
        toast(`${importedCards.length}枚をインポート完了`);
      });
    } catch(err) {
      console.error(err);
      toast('Excel読み込み失敗: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  ev.target.value = '';
}

// 全角数字を半角に正規化
function normalizeNumStr(v) {
  if (v === null || v === undefined) return '';
  let s = String(v).trim();
  if (!s) return '';
  s = s.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
  return s;
}

// ============ JSON / CSV ============
function exportJSON() {
  const data = {
    cards: state.cards, types: state.types, decks: state.decks,
    cardIdCounter, exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  download(blob, 'card-forge-data.json');
  toast('JSON出力完了');
}
function importJSON(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (Array.isArray(data)) {
        showModal('JSONインポート', `${data.length}枚のカードを読み込みます。`, () => {
          state.cards = data.map(c => c.id ? c : {id: cid(), ...c});
          saveData(); render(); renderDeckList();
          toast(`${data.length}枚を読み込みました`);
        });
      } else if (data.cards) {
        showModal('JSONインポート', `カード${data.cards.length}枚、デッキ${(data.decks||[]).length}個を読み込みます。`, () => {
          state.cards = data.cards;
          state.types = data.types || [];
          state.decks = data.decks || [];
          ensureBuiltinTypes();
          cardIdCounter = data.cardIdCounter || (state.cards.length + 1);
          state.cards.forEach(c => { if (!c.id) c.id = cid(); });
          saveData();
          refreshTypeSelects(); render(); renderDeckList(); renderSettings();
          toast('インポート完了');
        });
      } else throw new Error('形式不明');
    } catch(err) { toast('JSON読み込み失敗'); console.error(err); }
  };
  reader.readAsText(file);
  ev.target.value = '';
}
function exportCSV() {
  const headers = ['type','name','icon','level','subrole','hp','ip','shinsaku','unlimited','skill1','skill2','effect1','effect2','effect3','other','art'];
  const rows = [headers.join(',')];
  state.cards.forEach(c => {
    rows.push(headers.map(h => csvEscape(c[h] === true ? 'true' : (c[h] === false ? '' : (c[h] || '')))).join(','));
  });
  const blob = new Blob(['\uFEFF' + rows.join('\n')], {type:'text/csv'});
  download(blob, 'cards.csv');
  toast('CSV出力完了');
}
function csvEscape(s) {
  s = String(s);
  if (s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// ============ PLAY (テストプレイ用プレイマット) ============
const PLAY_INITIAL_HAND = 7;
const PLAY_VICTORY_MANUSCRIPT = 10;
let playInstanceCounter = 1;
function pInst() { return 'pi' + (playInstanceCounter++); }

// 1サイドの初期state
function makePlaySide(deckId, name) {
  return {
    name: name || '',
    deckId: deckId,
    manuscript: 0,
    ip: 0,
    hand: [],            // [{instanceId, cardId, hp?}]
    deck: [],            // 山札 (上から取る)
    leader: [],          // リーダーゾーン (現在のリーダー、最大1枚)
    leaderReserve: [],   // リーダー控え (Lv2/Lv3 等の進化先)
    field: [],           // 場 (キャラ・継続効果)
    discard: []          // 没案ゾーン
  };
}

// デッキIDからインスタンス配列を構築
function buildDeckInstances(deckId) {
  const deck = state.decks.find(d => d.id === deckId);
  if (!deck) return [];
  const instances = [];
  (deck.cards || []).forEach(entry => {
    for (let i = 0; i < entry.count; i++) {
      const card = state.cards.find(c => c.id === entry.cardId);
      const inst = { instanceId: pInst(), cardId: entry.cardId };
      // キャラの初期HPを格納
      if (card && card.hp) inst.hp = parseInt(card.hp) || 0;
      instances.push(inst);
    }
  });
  return instances;
}

// Fisher-Yates シャッフル
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 主人公(リーダー)カードを山札から抜いて、Lv1=リーダーゾーン / Lv2以降=控え に配置 (ゲーム開始時に呼ぶ)
// cardPool: カード参照を解決するためのプール(state.cards + 必要なら相手のカード)
function extractLeadersToZone(side, cardPool) {
  if (!side.leader) side.leader = [];
  if (!side.leaderReserve) side.leaderReserve = [];
  const heroInstIds = new Set();
  side.deck.forEach(inst => {
    const card = (cardPool || state.cards).find(c => c.id === inst.cardId);
    if (card && isLeaderCard(card)) heroInstIds.add(inst.instanceId);
  });
  const heroes = side.deck.filter(inst => heroInstIds.has(inst.instanceId));
  side.deck = side.deck.filter(inst => !heroInstIds.has(inst.instanceId));
  // レベル順(1→2→3)、同名内でレベル順、別ヒーローはまとめて
  heroes.sort((a, b) => {
    const ca = (cardPool || state.cards).find(c => c.id === a.cardId) || {};
    const cb = (cardPool || state.cards).find(c => c.id === b.cardId) || {};
    if ((ca.name || '') !== (cb.name || '')) return (ca.name || '').localeCompare(cb.name || '');
    return (parseInt(ca.level) || 0) - (parseInt(cb.level) || 0);
  });
  // Lv1 をリーダーゾーンへ(最初に見つかったLv1のみ。複数リーダー入れた場合の二人目以降は控え)
  // Lv1 がなければ最も低いレベルをリーダーに
  let leaderPlaced = false;
  heroes.forEach(h => {
    const c = (cardPool || state.cards).find(c => c.id === h.cardId) || {};
    const isLv1 = parseInt(c.level) === 1;
    if (!leaderPlaced && (isLv1 || side.leader.length === 0 && heroes.indexOf(h) === 0)) {
      // 最初の Lv1 をリーダーゾーンへ
      if (isLv1 && !leaderPlaced) {
        side.leader.push(h);
        leaderPlaced = true;
        return;
      }
    }
    side.leaderReserve.push(h);
  });
  // フォールバック: Lv1 が見つからずリーダーが空のままなら、控えの先頭をリーダーに
  if (!leaderPlaced && side.leaderReserve.length > 0) {
    side.leader.push(side.leaderReserve.shift());
  }
  return heroes.length;
}

// プレイ開始 (ソロ)
function startPlaySession() {
  const deckIdA = document.getElementById('play-deckA').value;
  const deckIdB = document.getElementById('play-deckB').value;
  const nameA = document.getElementById('play-nameA').value.trim() || 'プレイヤーA';
  const nameB = document.getElementById('play-nameB').value.trim() || 'プレイヤーB';
  if (!deckIdA || !deckIdB) { toast('両方のデッキを選んでください'); return; }

  const sideA = makePlaySide(deckIdA, nameA);
  const sideB = makePlaySide(deckIdB, nameB);
  sideA.deck = shuffleArray(buildDeckInstances(deckIdA));
  sideB.deck = shuffleArray(buildDeckInstances(deckIdB));
  // リーダー(主人公)カードは山札から抜いて場へ
  const heroesA = extractLeadersToZone(sideA, state.cards);
  const heroesB = extractLeadersToZone(sideB, state.cards);
  // 初手ドロー(リーダーを除いた山から)
  for (let i = 0; i < PLAY_INITIAL_HAND; i++) {
    if (sideA.deck.length) sideA.hand.push(sideA.deck.shift());
    if (sideB.deck.length) sideB.hand.push(sideB.deck.shift());
  }

  state.playSession = {
    active: true,
    turn: 1,
    activeSide: 'A',
    phase: 'メイン',
    sides: { A: sideA, B: sideB },
    log: [],
    network: { mode: 'solo' }
  };
  playLog(null, `ゲーム開始 (${nameA} vs ${nameB})`);
  if (heroesA > 0) playLog('A', `主人公 ${heroesA} 枚を主人公ゾーンへ配置`);
  if (heroesB > 0) playLog('B', `主人公 ${heroesB} 枚を主人公ゾーンへ配置`);
  playLog('A', `初手 ${sideA.hand.length} 枚ドロー`);
  playLog('B', `初手 ${sideB.hand.length} 枚ドロー`);
  saveData();
  renderPlay();
}

function endPlaySession() {
  showModal('プレイ終了', '現在のセッションを終了します。記録は失われます。', () => {
    // ネット対戦中なら相手にも通知
    if (netConn && netConn.open) {
      try { netConn.send({ type: 'BYE' }); } catch(e) {}
    }
    netCleanup();
    state.playSession = null;
    saveData();
    renderPlay();
    toast('プレイセッションを終了');
  });
}

function restartPlaySession() {
  if (!state.playSession) return;
  showModal('リスタート', '現在のセッションをリセットして、同じデッキで再開します。', () => {
    const ps = state.playSession;
    const nameA = ps.sides.A.name, nameB = ps.sides.B.name;
    const deckIdA = ps.sides.A.deckId, deckIdB = ps.sides.B.deckId;
    const sideA = makePlaySide(deckIdA, nameA);
    const sideB = makePlaySide(deckIdB, nameB);
    sideA.deck = shuffleArray(buildDeckInstances(deckIdA));
    sideB.deck = shuffleArray(buildDeckInstances(deckIdB));
    extractLeadersToZone(sideA, state.cards);
    extractLeadersToZone(sideB, state.cards);
    for (let i = 0; i < PLAY_INITIAL_HAND; i++) {
      if (sideA.deck.length) sideA.hand.push(sideA.deck.shift());
      if (sideB.deck.length) sideB.hand.push(sideB.deck.shift());
    }
    state.playSession = {
      active: true, turn: 1, activeSide: 'A', phase: 'メイン',
      sides: { A: sideA, B: sideB }, log: [],
      network: { mode: 'solo' }
    };
    playLog(null, 'リスタート');
    saveData(); renderPlay();
  });
}

// ============ ログ ============
function playLog(side, text) {
  if (!state.playSession) return;
  state.playSession.log.unshift({
    turn: state.playSession.turn,
    side: side,
    text: text,
    ts: Date.now()
  });
  if (state.playSession.log.length > 200) state.playSession.log.length = 200;
}

function togglePlayLog() {
  document.getElementById('playLogPanel').classList.toggle('show');
}

// ============ ターン進行 ============
function endTurn() {
  if (!state.playSession) return;
  const ps = state.playSession;
  const oldSide = ps.activeSide;
  ps.activeSide = ps.activeSide === 'A' ? 'B' : 'A';
  if (ps.activeSide === 'A') ps.turn++; // BからAに戻ったらターン++
  playLog(oldSide, `ターン終了 → ${ps.activeSide}のターン (${ps.turn})`);
  saveData(); renderPlay();
  netSendOp({ type: 'endTurn' });
}

function changePhase(phase) {
  if (!state.playSession) return;
  state.playSession.phase = phase;
  saveData(); renderPlay();
  netSendOp({ type: 'phase', phase });
}

// ============ カウンタ ============
function adjustCounter(side, key, delta) {
  if (!state.playSession) return;
  const s = state.playSession.sides[side];
  if (!s) return;
  const oldVal = s[key];
  s[key] = Math.max(0, (s[key] || 0) + delta);
  if (s[key] !== oldVal) {
    const labels = { manuscript: '原稿', ip: 'IP' };
    playLog(side, `${labels[key]} ${oldVal} → ${s[key]}`);
    if (key === 'manuscript' && s[key] >= PLAY_VICTORY_MANUSCRIPT && oldVal < PLAY_VICTORY_MANUSCRIPT) {
      toast(`🏆 ${s.name} の作品が完成しました! (原稿${PLAY_VICTORY_MANUSCRIPT}枚)`);
      playLog(side, `🏆 勝利条件達成 (原稿${PLAY_VICTORY_MANUSCRIPT}枚)`);
    }
  }
  saveData(); renderPlay();
  netSendOp({ type: 'counter', side, key, delta });
}

function adjustFieldHP(side, instanceId, delta) {
  if (!state.playSession) return;
  const s = state.playSession.sides[side];
  const inst = s.field.find(x => x.instanceId === instanceId);
  if (!inst) return;
  const oldHp = inst.hp || 0;
  inst.hp = Math.max(0, oldHp + delta);
  const card = findPlayCard(inst.cardId);
  playLog(side, `${card?.name || '?'} HP ${oldHp} → ${inst.hp}`);
  saveData(); renderPlay();
  netSendOp({ type: 'hp', side, instanceId, delta });
  // ポップオーバーが開いていれば最新のHP値で再描画
  if (document.getElementById('playPopoverBg').classList.contains('show')) {
    openPlayPopover(side, instanceId, 'field');
  }
}

// ============ ゾーン移動 ============
function moveInstance(side, instanceId, fromZone, toZone, toTop) {
  if (!state.playSession) return;
  const s = state.playSession.sides[side];
  if (!s.leader) s.leader = [];
  if (!s.leaderReserve) s.leaderReserve = [];
  const fromArr = s[fromZone];
  if (!fromArr) return;
  const idx = fromArr.findIndex(x => x.instanceId === instanceId);
  if (idx < 0) return;
  const [inst] = fromArr.splice(idx, 1);

  // リーダーゾーンは1枚まで: 既存があれば没案へ自動移動(=練り上げ・レベル交代)
  if (toZone === 'leader' && s.leader.length >= 1) {
    const evicted = s.leader.shift();
    s.discard.push(evicted);
    const evictedCard = findPlayCard(evicted.cardId);
    playLog(side, `${evictedCard?.name || '?'} を没案へ (主人公交代)`);
  }

  // 場に出すときはHPをリセット
  if (toZone === 'field') {
    const card = findPlayCard(inst.cardId);
    if (card && card.hp && (inst.hp === undefined || inst.hp === 0)) {
      inst.hp = parseInt(card.hp) || 0;
    }
  }

  const toArr = s[toZone];
  if (!toArr) return;
  if (toZone === 'deck' && !toTop) toArr.push(inst); // 山の底
  else if (toZone === 'deck' && toTop) toArr.unshift(inst); // 山の上
  else toArr.push(inst);

  const card = findPlayCard(inst.cardId);
  const labels = { hand: '手札', field: '場', discard: '没案', deck: '山', leader: '主人公', leaderReserve: '主人公控え' };
  const placeNote = toZone === 'deck' ? (toTop ? '山の上へ' : '山の底へ') : labels[toZone] + 'へ';
  playLog(side, `${card?.name || '?'} を${labels[fromZone]}から${placeNote}`);
  saveData(); renderPlay();
  netSendOp({ type: 'move', side, instanceId, fromZone, toZone, toTop: !!toTop });
  closePlayPopover();
}

function drawCard(side, n) {
  if (!state.playSession) return;
  const s = state.playSession.sides[side];
  n = n || 1;
  let drew = 0;
  for (let i = 0; i < n; i++) {
    if (s.deck.length === 0) break;
    s.hand.push(s.deck.shift());
    drew++;
  }
  if (drew > 0) playLog(side, `${drew}枚ドロー (山残${s.deck.length})`);
  else playLog(side, '山が空でドローできません');
  saveData(); renderPlay();
  netSendOp({ type: 'draw', side, n });
}

function shuffleDeck(side) {
  if (!state.playSession) return;
  const s = state.playSession.sides[side];
  shuffleArray(s.deck);
  playLog(side, `山をシャッフル (${s.deck.length}枚)`);
  saveData(); renderPlay();
  // shuffle結果(順序)を送信。受信側は netApplyRemoteOp で並び替えのみ実行(shuffleDeckは呼ばない)
  netSendOp({ type: 'shuffle', side, deckOrder: s.deck.map(x => x.instanceId) });
}

// ============ ポップオーバー (カードクリック時) ============
function openPlayPopover(side, instanceId, fromZone) {
  const s = state.playSession?.sides[side];
  if (!s) return;
  const inst = s[fromZone].find(x => x.instanceId === instanceId);
  if (!inst) return;
  const card = findPlayCard(inst.cardId);
  const cardName = card?.name || '(削除されたカード)';

  const actions = [];
  // 拡大表示
  actions.push({ label: `🔍 拡大表示`, fn: `openCardZoomById('${inst.cardId}')` });

  // ネット対戦時、自分のサイドでなければ操作はさせない(閲覧のみ)
  const canControl = myCanControl(side);
  if (!canControl) {
    const html = `
      <div class="play-popover-title">${escapeHtml(cardName)}${inst.hp !== undefined ? ` (HP ${inst.hp})` : ''}<br><span style="font-size:0.78rem; color:var(--parchment-dim);">相手のカードは操作できません</span></div>
      <div class="play-popover-actions">
        ${actions.map(a => `<button onclick="${a.fn}; closePlayPopover();">${a.label}</button>`).join('')}
        <button onclick="closePlayPopover()" style="margin-top: 8px;">閉じる</button>
      </div>`;
    document.getElementById('playPopover').innerHTML = html;
    document.getElementById('playPopoverBg').classList.add('show');
    return;
  }

  // ゾーン移動候補
  if (fromZone === 'leader') {
    actions.push({ label: '➡ 場に出す', fn: `moveInstance('${side}','${instanceId}','leader','field')` });
    actions.push({ label: '➡ 控えへ戻す', fn: `moveInstance('${side}','${instanceId}','leader','leaderReserve')` });
    actions.push({ label: '➡ 没案ゾーンへ (退場)', fn: `moveInstance('${side}','${instanceId}','leader','discard')` });
  } else if (fromZone === 'leaderReserve') {
    actions.push({ label: '➡ 主人公へ昇格 (練り上げ)', fn: `moveInstance('${side}','${instanceId}','leaderReserve','leader')` });
    actions.push({ label: '➡ 没案ゾーンへ', fn: `moveInstance('${side}','${instanceId}','leaderReserve','discard')` });
  } else if (fromZone === 'hand') {
    actions.push({ label: '➡ 場に出す', fn: `moveInstance('${side}','${instanceId}','hand','field')` });
    actions.push({ label: '➡ 没案ゾーンへ', fn: `moveInstance('${side}','${instanceId}','hand','discard')` });
    actions.push({ label: '➡ 山の上へ戻す', fn: `moveInstance('${side}','${instanceId}','hand','deck',true)` });
    actions.push({ label: '➡ 山の底へ戻す', fn: `moveInstance('${side}','${instanceId}','hand','deck',false)` });
  } else if (fromZone === 'field') {
    if (inst.hp !== undefined) {
      actions.push({ label: `❤ HP −1 (現${inst.hp})`, fn: `adjustFieldHP('${side}','${instanceId}',-1)`, keep: true });
      actions.push({ label: '❤ HP +1', fn: `adjustFieldHP('${side}','${instanceId}',1)`, keep: true });
      actions.push({ label: '❤ HP −10', fn: `adjustFieldHP('${side}','${instanceId}',-10)`, keep: true });
      actions.push({ label: '❤ HP +10', fn: `adjustFieldHP('${side}','${instanceId}',10)`, keep: true });
    }
    actions.push({ label: '➡ 没案ゾーンへ', fn: `moveInstance('${side}','${instanceId}','field','discard')` });
    actions.push({ label: '➡ 手札に戻す', fn: `moveInstance('${side}','${instanceId}','field','hand')` });
  } else if (fromZone === 'discard') {
    actions.push({ label: '➡ 手札に戻す', fn: `moveInstance('${side}','${instanceId}','discard','hand')` });
    actions.push({ label: '➡ 場に出す', fn: `moveInstance('${side}','${instanceId}','discard','field')` });
    actions.push({ label: '➡ 山の上へ', fn: `moveInstance('${side}','${instanceId}','discard','deck',true)` });
    actions.push({ label: '➡ 山の底へ', fn: `moveInstance('${side}','${instanceId}','discard','deck',false)` });
  } else if (fromZone === 'deck') {
    // 山のカードはドロー操作で対応するため、ここは「上を見る」だけ
    actions.push({ label: '➡ 手札に加える', fn: `moveInstance('${side}','${instanceId}','deck','hand')` });
    actions.push({ label: '➡ 没案ゾーンへ', fn: `moveInstance('${side}','${instanceId}','deck','discard')` });
  }

  const html = `
    <div class="play-popover-title">${escapeHtml(cardName)}${inst.hp !== undefined ? ` (HP ${inst.hp})` : ''}</div>
    <div class="play-popover-actions">
      ${actions.map(a => `<button onclick="${a.fn}; ${a.keep ? '' : 'closePlayPopover();'}">${a.label}</button>`).join('')}
      <button onclick="closePlayPopover()" style="margin-top: 8px;">キャンセル</button>
    </div>`;
  document.getElementById('playPopover').innerHTML = html;
  document.getElementById('playPopoverBg').classList.add('show');
}

function closePlayPopover() {
  document.getElementById('playPopoverBg').classList.remove('show');
}

// ホバーで原寸プレビュー表示 (テキストが小さくて読めないチップを補完)
function showPlayHoverPreview(cardId, event) {
  const card = findPlayCard(cardId);
  if (!card) return;
  const idx = state.cards.indexOf(card); // poolのカードは -1 になる(問題なし)
  const el = document.getElementById('playHoverPreview');
  el.innerHTML = buildCardHTML(card, Math.max(0, idx), {showIndex: false, attrs: ''});
  el.classList.add('show');

  // ホバーされたチップの近くに位置調整
  const chip = event?.currentTarget;
  if (chip) {
    const rect = chip.getBoundingClientRect();
    const previewW = 240;
    const previewH = Math.round(previewW * 88 / 63); // ≈ 336
    const margin = 10;
    // 横: チップの右に表示、画面外なら左、それでも入らなければ右端に貼り付け
    let left = rect.right + margin;
    if (left + previewW > window.innerWidth - margin) {
      left = rect.left - previewW - margin;
    }
    if (left < margin) left = window.innerWidth - previewW - margin;
    // 縦: チップ中央に合わせるが、画面の上下端を超えないようクランプ
    let top = rect.top + rect.height / 2 - previewH / 2;
    if (top < margin) top = margin;
    if (top + previewH > window.innerHeight - margin) top = window.innerHeight - previewH - margin;
    el.style.left = left + 'px';
    el.style.top = top + 'px';
    el.style.right = 'auto';
  }
}
function hidePlayHoverPreview() {
  document.getElementById('playHoverPreview').classList.remove('show');
}

function openCardZoomById(cardId) {
  // 自カードならstate.cards、相手カードはplaySession.cardPool から拾う
  const idx = state.cards.findIndex(c => c.id === cardId);
  if (idx >= 0) {
    openCardZoom(idx);
  } else {
    const card = findPlayCard(cardId);
    if (card) {
      // pool専用の表示(state.cardsのindexがないのでメタは「相手のカード」表記)
      document.getElementById('cardZoomCard').innerHTML = buildCardHTML(card, 0, {showIndex: false, attrs: ''});
      document.getElementById('cardZoomMeta').textContent = '相手のカード';
      document.getElementById('cardZoomBg').classList.add('show');
    }
  }
  closePlayPopover();
}

// ============ カードチップ描画 ============
function buildCardChip(inst, side, fromZone, faceDown) {
  const card = findPlayCard(inst.cardId);
  if (!card) {
    return `<div class="card-chip" title="(削除されたカード)" style="opacity:0.4;">
      <div class="card-chip-name">削除済</div></div>`;
  }
  const lvNum = parseInt(card.level) || 0;
  const classes = ['card-chip'];
  if (lvNum === 2) classes.push('lv2');
  if (lvNum === 3) classes.push('lv3');
  if (faceDown) classes.push('face-down');

  if (faceDown) {
    return `<div class="${classes.join(' ')}" title="伏せられたカード"></div>`;
  }

  const color = getTypeColor(card.type);
  const icon = getDisplayIcon(card);
  const lvBadge = card.level ? `<span class="card-chip-badge" style="background:${color}">${escapeHtml(card.level)}</span>` : '';
  const hpBadge = (inst.hp !== undefined && inst.hp !== null && inst.hp > 0)
    ? `<div class="card-chip-hp" title="現HP">${inst.hp}</div>` : '';
  const ipMark = card.ip ? `<span title="IP ${escapeHtml(card.ip)}">💎${escapeHtml(card.ip)}</span>` : '';
  const costMark = card.cost ? `<span title="コスト ${escapeHtml(card.cost)}">⚡${escapeHtml(card.cost)}</span>` : '';

  return `<div class="${classes.join(' ')}"
    onclick="openPlayPopover('${side}','${inst.instanceId}','${fromZone}')"
    onmouseenter="showPlayHoverPreview('${card.id}', event)"
    onmouseleave="hidePlayHoverPreview()"
    title="${escapeHtml(card.name || '')}">
    <div class="card-chip-head">
      ${lvBadge}
      <div class="card-chip-name">${escapeHtml(card.name || '無名')}</div>
    </div>
    <div class="card-chip-icon">${escapeHtml(icon)}</div>
    <div class="card-chip-foot">${ipMark}${costMark}</div>
    ${hpBadge}
  </div>`;
}

// ============ プレイ画面描画 ============
// セットアップ画面のモード状態(solo / host / guest)
let _playSetupMode = 'solo';
function switchPlaySetupMode(mode) {
  _playSetupMode = mode;
  renderPlay();
}

function renderPlay() {
  const root = document.getElementById('playRoot');
  if (!state.playSession || !state.playSession.active) {
    // セットアップ画面
    const deckOptions = state.decks.map(d =>
      `<option value="${escapeHtml(d.id)}">${escapeHtml(d.name)} (${getDeckTotalCount(d)}枚)</option>`
    ).join('');
    if (state.decks.length === 0) {
      root.innerHTML = `<div class="empty-state"><h3>NO DECKS</h3>
        <p>プレイにはデッキが必要です。「🃏 DECKS」タブで作成してください。</p></div>`;
      return;
    }
    const tabs = `
      <div class="play-mode-tabs">
        <button class="play-mode-tab ${_playSetupMode==='solo'?'active':''}" onclick="switchPlaySetupMode('solo')">🧍 ソロ(両陣営を自分で操作)</button>
        <button class="play-mode-tab ${_playSetupMode==='host'?'active':''}" onclick="switchPlaySetupMode('host')">🌐 ホスト(対戦相手を待つ)</button>
        <button class="play-mode-tab ${_playSetupMode==='guest'?'active':''}" onclick="switchPlaySetupMode('guest')">🌐 ゲスト(ルームに参加)</button>
      </div>`;

    let body = '';
    if (_playSetupMode === 'solo') {
      body = `
        <h2>テストプレイ — ソロモード</h2>
        <p>2デッキを選んで、初手7枚ドローでスタート。両陣営を自分で操作します。</p>
        <div class="play-setup-row">
          <div class="field"><label>プレイヤー A</label><input type="text" id="play-nameA" value="プレイヤーA"></div>
          <div class="field"><label>プレイヤー B</label><input type="text" id="play-nameB" value="プレイヤーB"></div>
        </div>
        <div class="play-setup-row">
          <div class="field"><label>A のデッキ</label><select id="play-deckA"><option value="">選択してください</option>${deckOptions}</select></div>
          <div class="field"><label>B のデッキ</label><select id="play-deckB"><option value="">選択してください</option>${deckOptions}</select></div>
        </div>
        <div class="play-setup-actions">
          <button class="btn-primary" onclick="startPlaySession()">▶ プレイ開始</button>
        </div>`;
    } else if (_playSetupMode === 'host') {
      body = `
        <h2>テストプレイ — ホスト</h2>
        <p>あなたがA側として開始します。「ルーム作成」を押すとルームIDが発行され、相手の参加を待ちます。</p>
        <div class="play-setup-row">
          <div class="field"><label>あなたの名前</label><input type="text" id="play-nameHost" value="ホスト"></div>
          <div class="field"><label>使うデッキ</label><select id="play-deckHost"><option value="">選択してください</option>${deckOptions}</select></div>
        </div>
        <div class="play-setup-actions">
          <button class="btn-primary" onclick="netHostRoom()">🌐 ルーム作成</button>
        </div>`;
    } else if (_playSetupMode === 'guest') {
      body = `
        <h2>テストプレイ — ゲスト</h2>
        <p>ホストから受け取ったルームIDを入力して参加します。あなたはB側になります。</p>
        <div class="field" style="margin-bottom:14px;">
          <label>ルームID</label>
          <input type="text" id="play-roomId" placeholder="cf-XXXXXX" style="font-family:'Cinzel',serif; letter-spacing:0.1em;">
        </div>
        <div class="play-setup-row">
          <div class="field"><label>あなたの名前</label><input type="text" id="play-nameGuest" value="ゲスト"></div>
          <div class="field"><label>使うデッキ</label><select id="play-deckGuest"><option value="">選択してください</option>${deckOptions}</select></div>
        </div>
        <div class="play-setup-actions">
          <button class="btn-primary" onclick="netJoinRoom()">🌐 参加する</button>
        </div>`;
    }
    root.innerHTML = `<div class="play-setup">${tabs}${body}</div>`;
    return;
  }

  // 切断状態
  if (state.playSession.network?.disconnected) {
    root.innerHTML = `
      <div class="play-setup">
        <h2>⚠ 接続が切れました</h2>
        <p>相手との接続が失われました。セッションを終了するか、ソロモードで継続してください。</p>
        <div class="play-setup-actions">
          <button onclick="state.playSession.network={mode:'solo'}; saveData(); renderPlay();">🧍 ソロで継続</button>
          <button class="btn-danger" onclick="state.playSession=null; saveData(); renderPlay();">セッション終了</button>
