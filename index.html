  const ps = state.playSession;
  root.innerHTML = `
    <div class="play-board">
      ${renderPlaySide('B')}
      ${renderTurnBar()}
      ${renderPlaySide('A')}
    </div>`;
  // ログパネルの中身も毎回更新
  renderPlayLogList();
}

function renderPlayLogList() {
  const list = document.getElementById('playLogList');
  if (!list) return;
  const ps = state.playSession;
  if (!ps) { list.innerHTML = ''; return; }
  list.innerHTML = ps.log.map(e => `
    <div class="play-log-entry side-${e.side || 'sys'}">
      <span class="play-log-entry-meta">T${e.turn}${e.side ? ' '+e.side : ''}</span>
      ${escapeHtml(e.text)}
    </div>`).join('') ||
    '<div class="play-zone-empty">まだログはありません</div>';
}

function renderPlaySide(sideKey) {
  const ps = state.playSession;
  const s = ps.sides[sideKey];
  if (!s.leader) s.leader = []; // 旧データ互換
  if (!s.leaderReserve) s.leaderReserve = [];
  const isActive = ps.activeSide === sideKey;
  const canControl = myCanControl(sideKey);
  const dis = canControl ? '' : 'disabled';
  // ネット対戦中、相手の手札は内容を伏せて枚数のみ
  const hideOppHand = !canControl;

  const leaderHtml = s.leader.length === 0
    ? '<div class="play-zone-empty">主人公なし</div>'
    : s.leader.map(inst => buildCardChip(inst, sideKey, 'leader', false)).join('');
  const reserveHtml = s.leaderReserve.length === 0
    ? '<div class="play-zone-empty">控えなし</div>'
    : s.leaderReserve.map(inst => buildCardChip(inst, sideKey, 'leaderReserve', false)).join('');
  const handHtml = s.hand.length === 0
    ? '<div class="play-zone-empty">手札なし</div>'
    : s.hand.map(inst => buildCardChip(inst, sideKey, 'hand', hideOppHand)).join('');
  const fieldHtml = s.field.length === 0
    ? '<div class="play-zone-empty">場にカードなし</div>'
    : s.field.map(inst => buildCardChip(inst, sideKey, 'field', false)).join('');
  const discardHtml = s.discard.length === 0
    ? '<div class="play-zone-empty">没案なし</div>'
    : s.discard.slice().reverse().map(inst => buildCardChip(inst, sideKey, 'discard', false)).join('');
  // 山: 自分側は上3枚伏せプレビュー、相手側は枚数だけ表示(内容を覗き見できないように)
  const deckPreview = canControl
    ? s.deck.slice(0, 3).map(inst => buildCardChip(inst, sideKey, 'deck', true)).join('')
    : '';

  return `
    <div class="play-side ${isActive ? 'active' : ''} ${canControl?'mine':'opponent'}">
      <div class="play-side-header">
        <div class="play-side-name">${escapeHtml(s.name)}${isActive ? ' ◆' : ''}${canControl?'':' (相手)'}</div>
        <div class="play-counter">
          <span class="play-counter-label">原稿</span>
          <button class="play-counter-btn" onclick="adjustCounter('${sideKey}','manuscript',-1)" ${dis}>−</button>
          <span class="play-counter-value">${s.manuscript}</span>
          <button class="play-counter-btn" onclick="adjustCounter('${sideKey}','manuscript',1)" ${dis}>＋</button>
          <span class="play-counter-label">/ ${PLAY_VICTORY_MANUSCRIPT}</span>
        </div>
        <div class="play-counter">
          <span class="play-counter-label">IP</span>
          <button class="play-counter-btn" onclick="adjustCounter('${sideKey}','ip',-1)" ${dis}>−</button>
          <span class="play-counter-value">${s.ip}</span>
          <button class="play-counter-btn" onclick="adjustCounter('${sideKey}','ip',1)" ${dis}>＋</button>
        </div>
        ${canControl ? `<button class="btn-small" onclick="drawCard('${sideKey}',1)">山からドロー</button>
        <button class="btn-small" onclick="shuffleDeck('${sideKey}')">山シャッフル</button>` : ''}
      </div>

      <div class="play-leader-row">
        <div class="play-zone play-zone-leader">
          <div class="play-zone-title"><span>👑 主人公</span><span class="play-zone-count">${s.leader.length}/1</span></div>
          <div class="play-zone-cards">${leaderHtml}</div>
        </div>
        <div class="play-zone play-zone-reserve">
          <div class="play-zone-title"><span>🎒 主人公控え</span><span class="play-zone-count">${s.leaderReserve.length}</span></div>
          <div class="play-zone-cards">${reserveHtml}</div>
        </div>
      </div>

      <div class="play-zones">
        <div class="play-zone">
          <div class="play-zone-title"><span>手札</span><span class="play-zone-count">${s.hand.length}</span></div>
          <div class="play-zone-cards">${handHtml}</div>
        </div>
        <div class="play-zone">
          <div class="play-zone-title"><span>場</span><span class="play-zone-count">${s.field.length}</span></div>
          <div class="play-zone-cards">${fieldHtml}</div>
        </div>
        <div class="play-zone">
          <div class="play-zone-title"><span>没案ゾーン</span><span class="play-zone-count">${s.discard.length}</span></div>
          <div class="play-zone-cards">${discardHtml}</div>
        </div>
        <div class="play-zone">
          <div class="play-zone-title"><span>山 (デッキ)</span><span class="play-zone-count">${s.deck.length}</span></div>
          <div class="play-zone-cards">${deckPreview}${s.deck.length > 3 ? `<div style="align-self:center; color:var(--parchment-dim); font-size:0.8rem; padding:0 6px;">他${s.deck.length - 3}枚</div>` : ''}</div>
        </div>
      </div>
    </div>`;
}

function renderTurnBar() {
  const ps = state.playSession;
  const activeName = ps.sides[ps.activeSide].name;
  const net = ps.network || { mode: 'solo' };
  const netBadge = net.mode === 'host' ? `<span class="play-net-badge host" title="ルームID: ${escapeHtml(net.roomId||'')}">🌐 HOST (${escapeHtml(net.mySide)}側) [${escapeHtml(net.roomId||'')}]</span>`
                  : net.mode === 'guest' ? `<span class="play-net-badge guest">🌐 GUEST (${escapeHtml(net.mySide)}側)</span>`
                  : '';
  const myTurn = net.mode === 'solo' || net.mySide === ps.activeSide;
  return `
    <div class="play-turnbar">
      <div class="play-turn-info">
        <div class="play-turn-num">ターン ${ps.turn}</div>
        <div class="play-active-side">アクティブ: <strong>${escapeHtml(activeName)}</strong>${myTurn?'':' (相手ターン)'}</div>
        ${netBadge}
        <div>フェーズ:
          <select onchange="changePhase(this.value)" ${myTurn?'':'disabled'}>
            ${['ドロー','メイン','バトル','エンド','相手ターン'].map(p =>
              `<option value="${p}" ${ps.phase===p?'selected':''}>${p}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="play-turnbar-actions">
        <button class="btn-primary" onclick="endTurn()" ${myTurn?'':'disabled'}>ターン終了</button>
        <button class="btn-small" onclick="togglePlayLog()">📜 ログ (${ps.log.length})</button>
        ${net.mode === 'solo' ? `<button class="btn-small" onclick="restartPlaySession()">↺ リスタート</button>` : ''}
        <button class="btn-small btn-danger" onclick="endPlaySession()">✕ 終了</button>
      </div>
    </div>`;
}

// ============ PLAY NETWORK (PeerJS二台対戦) ============
let netPeer = null;
let netConn = null;
let _isApplyingRemoteOp = false;

function netGenerateRoomId() {
  // 6文字の英数(混同しやすい0/O/1/Iは除外)
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let id = 'cf-';
  for (let i = 0; i < 6; i++) id += chars[Math.floor(Math.random() * chars.length)];
  return id;
}

function netCleanup() {
  if (netConn) { try { netConn.close(); } catch(e){} netConn = null; }
  if (netPeer) { try { netPeer.destroy(); } catch(e){} netPeer = null; }
}

function myCanControl(side) {
  const net = state.playSession?.network;
  if (!net || net.mode === 'solo') return true;
  return net.mySide === side;
}

// ホストとして部屋を作成
function netHostRoom() {
  const deckIdHost = document.getElementById('play-deckHost').value;
  const nameHost = document.getElementById('play-nameHost').value.trim() || 'プレイヤー(ホスト)';
  if (!deckIdHost) { toast('デッキを選んでください'); return; }
  if (typeof Peer === 'undefined') { toast('PeerJS が読み込まれていません'); return; }

  netCleanup();
  const roomId = netGenerateRoomId();
  const root = document.getElementById('playRoot');
  root.innerHTML = `
    <div class="play-setup">
      <h2>🌐 ホスト中 — 接続待機</h2>
      <p>このルームIDを相手に伝えてください。相手が「参加」で入力すると接続成立します。</p>
      <div style="background: var(--bg-deep); border:1px solid var(--gold); padding: 18px; text-align:center; margin: 16px 0;">
        <div style="font-family:'Cinzel',serif; color:var(--parchment-dim); font-size:0.78rem; letter-spacing:0.15em;">ROOM ID</div>
        <div style="font-family:'Cinzel',serif; color:var(--gold-bright); font-size:1.8rem; font-weight:700; letter-spacing:0.1em; margin: 8px 0;">${roomId}</div>
        <button class="btn-small" onclick="navigator.clipboard?.writeText('${roomId}'); toast('コピーしました');">📋 コピー</button>
      </div>
      <div id="netStatus" style="color: var(--parchment-dim); font-style: italic; text-align: center;">接続待ち...</div>
      <div class="play-setup-actions">
        <button onclick="netHostCancel()">キャンセル</button>
      </div>
    </div>`;

  netPeer = new Peer(roomId);
  netPeer.on('open', () => {
    document.getElementById('netStatus').textContent = '相手の接続を待っています...';
  });
  netPeer.on('error', (err) => {
    console.error('Peer error:', err);
    const statusEl = document.getElementById('netStatus');
    if (statusEl) statusEl.textContent = `エラー: ${err.type || err.message}`;
    toast('PeerJS エラー: ' + (err.type || err.message));
  });
  netPeer.on('connection', (conn) => {
    netConn = conn;
    conn.on('open', () => {
      // ゲストから挨拶を待ってからINITを送る
      document.getElementById('netStatus').textContent = '接続成立。初期化中...';
    });
    conn.on('data', (msg) => netHandleMessage(msg, 'host', { deckIdHost, nameHost }));
    conn.on('close', () => netOnDisconnect());
    conn.on('error', (e) => { console.error(e); toast('通信エラー'); });
  });
}

function netHostCancel() {
  netCleanup();
  renderPlay();
}

// ゲストとして部屋に参加
function netJoinRoom() {
  const roomId = (document.getElementById('play-roomId')?.value || '').trim();
  const deckIdGuest = document.getElementById('play-deckGuest').value;
  const nameGuest = document.getElementById('play-nameGuest').value.trim() || 'プレイヤー(ゲスト)';
  if (!roomId) { toast('ルームIDを入力してください'); return; }
  if (!deckIdGuest) { toast('デッキを選んでください'); return; }
  if (typeof Peer === 'undefined') { toast('PeerJS が読み込まれていません'); return; }

  netCleanup();
  const root = document.getElementById('playRoot');
  root.innerHTML = `
    <div class="play-setup">
      <h2>🌐 接続中...</h2>
      <p>ルーム <strong>${escapeHtml(roomId)}</strong> に参加中</p>
      <div id="netStatus" style="color: var(--parchment-dim); font-style: italic; text-align: center; margin: 16px 0;">接続待ち...</div>
      <div class="play-setup-actions">
        <button onclick="netJoinCancel()">キャンセル</button>
      </div>
    </div>`;

  netPeer = new Peer();
  netPeer.on('open', (myId) => {
    document.getElementById('netStatus').textContent = 'ホストに接続中...';
    netConn = netPeer.connect(roomId, { reliable: true });
    netConn.on('open', () => {
      document.getElementById('netStatus').textContent = '接続成立。デッキ情報を送信...';
      // ゲスト側のデッキ instances を構築 (シャッフル済) し、参照される全カードと一緒に送る
      const guestDeckInstances = shuffleArray(buildDeckInstances(deckIdGuest));
      const guestCardPool = collectCardsForInstances(guestDeckInstances);
      netConn.send({
        type: 'HELLO',
        deckIdGuest,
        nameGuest,
        deckInstances: guestDeckInstances,
        cardPool: guestCardPool
      });
    });
    netConn.on('data', (msg) => netHandleMessage(msg, 'guest', { deckIdGuest, nameGuest }));
    netConn.on('close', () => netOnDisconnect());
    netConn.on('error', (e) => { console.error(e); toast('通信エラー'); });
  });
  netPeer.on('error', (err) => {
    console.error('Peer error:', err);
    const statusEl = document.getElementById('netStatus');
    if (statusEl) statusEl.textContent = `エラー: ${err.type || err.message}`;
    if (err.type === 'peer-unavailable') {
      toast('そのルームIDは見つかりません');
    } else {
      toast('PeerJS エラー: ' + (err.type || err.message));
    }
  });
}

function netJoinCancel() {
  netCleanup();
  renderPlay();
}

// メッセージ受信ハンドラ
function netHandleMessage(msg, role, ctx) {
  if (!msg || !msg.type) return;
  if (msg.type === 'HELLO' && role === 'host') {
    // ホスト: ゲストから情報を受け取った → INIT送信
    const deckIdHost = ctx.deckIdHost, nameHost = ctx.nameHost;
    const nameGuest = msg.nameGuest;
    // ホスト=A, ゲスト=B として開始
    const sideA = makePlaySide(deckIdHost, nameHost);
    const sideB = makePlaySide(msg.deckIdGuest, nameGuest);
    // ホスト側: 自分のデッキを構築
    sideA.deck = shuffleArray(buildDeckInstances(deckIdHost));
    // ゲスト側: HELLOで受け取った既にシャッフル済のinstancesをそのまま使う
    sideB.deck = (msg.deckInstances || []).slice();
    if (sideB.deck.length === 0) {
      toast('ゲストのデッキが空です(エラー)');
      return;
    }
    // 両者のカードを統合したプール(リーダー抽出と表示の両方で使う)
    const cardPool = mergeCardPools(
      collectCardsForInstances([...sideA.deck]),
      msg.cardPool || []
    );
    // リーダー(主人公)カードを場へ
    const heroesA = extractLeadersToZone(sideA, cardPool);
    const heroesB = extractLeadersToZone(sideB, cardPool);
    // 初手ドロー(リーダーを除いた山から)
    for (let i = 0; i < PLAY_INITIAL_HAND; i++) {
      if (sideA.deck.length) sideA.hand.push(sideA.deck.shift());
      if (sideB.deck.length) sideB.hand.push(sideB.deck.shift());
    }
    state.playSession = {
      active: true, turn: 1, activeSide: 'A', phase: 'メイン',
      sides: { A: sideA, B: sideB }, log: [],
      network: { mode: 'host', mySide: 'A', roomId: netPeer.id },
      cardPool: cardPool
    };
    playLog(null, `ゲーム開始 (${nameHost} vs ${nameGuest})`);
    if (heroesA > 0) playLog('A', `主人公 ${heroesA} 枚を主人公ゾーンへ配置`);
    if (heroesB > 0) playLog('B', `主人公 ${heroesB} 枚を主人公ゾーンへ配置`);
    playLog('A', `初手 ${sideA.hand.length} 枚ドロー`);
    playLog('B', `初手 ${sideB.hand.length} 枚ドロー`);
    saveData();
    netConn.send({ type: 'INIT', playSession: serializableSession(state.playSession), guestSide: 'B' });
    renderPlay();
    toast('対戦相手と接続しました');
  } else if (msg.type === 'INIT' && role === 'guest') {
    // ゲスト: ホストから初期stateを受け取った
    state.playSession = msg.playSession;
    state.playSession.network = { mode: 'guest', mySide: msg.guestSide, roomId: '' };
    saveData();
    invalidateIconCache();
    renderPlay();
    toast('対戦が開始しました');
  } else if (msg.type === 'OP') {
    netApplyRemoteOp(msg.op);
  } else if (msg.type === 'BYE') {
    toast('相手がプレイを終了しました');
    netOnDisconnect();
  }
}

// インスタンス配列に含まれる cardId のカードを state.cards から拾う
function collectCardsForInstances(instances) {
  const seen = new Set();
  const result = [];
  instances.forEach(inst => {
    if (seen.has(inst.cardId)) return;
    const card = state.cards.find(c => c.id === inst.cardId);
    if (card) {
      result.push(card);
      seen.add(inst.cardId);
    }
  });
  return result;
}

// カードプールを結合(IDで重複排除)
function mergeCardPools(...pools) {
  const seen = new Set();
  const result = [];
  pools.forEach(pool => {
    pool.forEach(c => {
      if (!seen.has(c.id)) {
        result.push(c);
        seen.add(c.id);
      }
    });
  });
  return result;
}

// プレイ中はカードプール優先で検索(相手のカードもここに含まれる)
function findPlayCard(cardId) {
  if (state.playSession?.cardPool) {
    const fromPool = state.playSession.cardPool.find(c => c.id === cardId);
    if (fromPool) return fromPool;
  }
  return state.cards.find(c => c.id === cardId);
}

// シリアライズ用に network/conn を除外したコピーを作る
function serializableSession(ps) {
  if (!ps) return null;
  const copy = JSON.parse(JSON.stringify(ps));
  if (copy.network) copy.network = null; // ゲスト側で再設定するためクリア
  return copy;
}

// 操作を相手に送信
function netSendOp(op) {
  if (_isApplyingRemoteOp) return;
  const net = state.playSession?.network;
  if (!net || net.mode === 'solo') return;
  if (!netConn || !netConn.open) return;
  netConn.send({ type: 'OP', op });
}

// 受信した操作を適用
function netApplyRemoteOp(op) {
  _isApplyingRemoteOp = true;
  try {
    if (op.type === 'draw') drawCard(op.side, op.n);
    else if (op.type === 'move') moveInstance(op.side, op.instanceId, op.fromZone, op.toZone, op.toTop);
    else if (op.type === 'counter') adjustCounter(op.side, op.key, op.delta);
    else if (op.type === 'hp') adjustFieldHP(op.side, op.instanceId, op.delta);
    else if (op.type === 'shuffle') {
      // 受信した順序にデッキを並べ直す
      const s = state.playSession.sides[op.side];
      const map = {};
      s.deck.forEach(x => { map[x.instanceId] = x; });
      s.deck = op.deckOrder.map(id => map[id]).filter(Boolean);
      playLog(op.side, `山をシャッフル (${s.deck.length}枚)`);
      saveData(); renderPlay();
    }
    else if (op.type === 'endTurn') endTurn();
    else if (op.type === 'phase') changePhase(op.phase);
  } finally {
    _isApplyingRemoteOp = false;
  }
}

function netOnDisconnect() {
  if (state.playSession?.network && state.playSession.network.mode !== 'solo') {
    state.playSession.network.disconnected = true;
    saveData();
    renderPlay();
    toast('接続が切れました');
  }
  netCleanup();
}

async function generatePDF(mode) {
  let cardsToPrint, filename;
  if (mode === 'deck') {
    const deck = state.decks.find(d => d.id === state.currentDeckId);
    if (!deck) { toast('デッキが選択されていません'); return; }
    // 枚数分カードを複製して展開
    cardsToPrint = [];
    (deck.cards || []).forEach(entry => {
      const card = state.cards.find(c => c.id === entry.cardId);
      if (card) {
        for (let i = 0; i < entry.count; i++) {
          cardsToPrint.push(card);
        }
      }
    });
    filename = `${deck.name}.pdf`;
  } else {
    cardsToPrint = state.cards;
    filename = 'カード印刷.pdf';
  }
  if (cardsToPrint.length === 0) { toast('印刷するカードがありません'); return; }

  toast('カード画像を生成中...');
  const offscreen = document.createElement('div');
  offscreen.style.cssText = `position: fixed; left: -10000px; top: 0; width: 760px; background: white;`;
  document.body.appendChild(offscreen);

  try {
    const cardImages = [];
    for (let i = 0; i < cardsToPrint.length; i++) {
      const el = createCardElementForPDF(cardsToPrint[i]);
      offscreen.innerHTML = ''; offscreen.appendChild(el);
      const canvas = await html2canvas(el, {scale: 1, useCORS: true, backgroundColor: '#FAFAF7', logging: false});
      cardImages.push(canvas.toDataURL('image/png'));
      if ((i + 1) % 3 === 0) toast(`画像生成中... ${i+1}/${cardsToPrint.length}`);
    }

    toast('PDFを構築中...');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit: 'mm', format: 'a4'});
    const A4_W = 210, A4_H = 297;
    const CARD_W = 63, CARD_H = 88;
    const COLS = 3, ROWS = 3;
    const marginX = (A4_W - CARD_W * COLS) / 2;
    const marginY = (A4_H - CARD_H * ROWS) / 2;
    const perPage = COLS * ROWS;

    for (let i = 0; i < cardsToPrint.length; i++) {
      const slot = i % perPage;
      if (slot === 0 && i > 0) doc.addPage();
      if (slot === 0) drawCropMarks(doc, A4_W, A4_H, marginX, marginY, CARD_W, CARD_H, COLS, ROWS);
      const col = slot % COLS;
      const row = Math.floor(slot / COLS);
      const x = marginX + col * CARD_W;
      const y = marginY + row * CARD_H;
      doc.addImage(cardImages[i], 'PNG', x, y, CARD_W, CARD_H);
    }
    doc.save(filename);
    toast(`${cardsToPrint.length}枚のPDFを生成`);
  } catch (err) {
    console.error(err);
    toast('PDF生成エラー: ' + err.message);
  } finally {
    document.body.removeChild(offscreen);
  }
}
function drawCropMarks(doc, A4_W, A4_H, mX, mY, CW, CH, cols, rows) {
  doc.setDrawColor(0); doc.setLineWidth(0.15);
  for (let i = 0; i <= cols; i++) {
    const x = mX + i * CW;
    doc.line(x, 0, x, mY - 1);
    doc.line(x, A4_H - mY + 1, x, A4_H);
  }
  for (let i = 0; i <= rows; i++) {
    const y = mY + i * CH;
    doc.line(0, y, mX - 1, y);
    doc.line(A4_W - mX + 1, y, A4_W, y);
  }
}
